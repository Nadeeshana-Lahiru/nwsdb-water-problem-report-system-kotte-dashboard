<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NWSDB Dashboard</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .dashboard-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .dashboard-container iframe {
      position: absolute;
      top: -28px; 
      left: 0;
      width: 100%;
      height: calc(100% + 28px); 
      border: none;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <iframe src="https://script.google.com/macros/s/AKfycbxzKuMjvX7RpI9_6ECI5DrBm6dj0fuNFWLgsipuBUc2CXjYFi3Th20wBgAO6eTZMoMS/exec"></iframe>
  </div>

</body>
</html>
